# ===== Application =====
base.url=https://untangled.cloudtesla.com
login.path=/auth/login
dashboard.path=/dashboard
form.always.enabled.path=/view-dreamboard/Forms/Notification%20Automation
form.always.disabled.path=/view-dreamboard/Forms/Notification%20Automation%20Condition

# ===== Login =====
# The password is NOT stored here. Set the UNTANGLED_PASSWORD environment variable.
username=nandish

# ===== Browser =====
browser.headless=false

# ===== Waiting (seconds) - increase these on slow networks =====
page.load.timeout=60
wait.timeout=30

# ===== Gmail waiting (seconds) =====
gmail.max.wait=60
gmail.poll.interval=2
gmail.quiet.period=10
gmail.zero.email.quiet.period=10
gmail.clock.buffer=2

# ===== Report =====
report.folder=reports
# true = also print the step logs in the console, false = report only
console.logs=false

# ===== Report email =====
# false = don't send (useful while debugging)
report.email.enabled=true
report.email.from=nandish@wimate.in
# One or more addresses, separated by commas
report.email.to=nandishmaram@gmail.com,maramnandish@gmail.com
# Sent through Gmail. The password is NOT stored here:
# set the REPORT_EMAIL_PASSWORD environment variable to a Gmail app password.

# ===== Test data =====
excel.path=testdata/NotificationTestData.xlsx
